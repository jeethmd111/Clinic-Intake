<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jithendra Clinic Intake</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f8fb;--card:#fff;--tx:#14202e;--mu:#5b6b7d;--bd:#d8e0ea;--ac:#0f766e;--red:#b91c1c;--amb:#b45309;--grn:#15803d}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1621;--card:#16212f;--tx:#e8eef5;--mu:#9fb0c3;--bd:#2a3a4d;--ac:#2dd4bf;--red:#f87171;--amb:#fbbf24;--grn:#4ade80}}
:root[data-theme=dark]{--bg:#0e1621;--card:#16212f;--tx:#e8eef5;--mu:#9fb0c3;--bd:#2a3a4d;--ac:#2dd4bf;--red:#f87171;--amb:#fbbf24;--grn:#4ade80}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--ac) 22%,var(--bg)),transparent 55%),radial-gradient(circle at 100% 30%,color-mix(in srgb,var(--ac) 10%,var(--bg)),transparent 50%),var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#0b3b66));border-radius:16px;padding:20px;margin:6px 0 16px;color:#fff;box-shadow:0 8px 24px rgba(15,118,110,.25)}h1{font-size:1.5rem;margin:0 0 4px}p.s{margin:0 0 12px;opacity:.95}.tg{display:flex;flex-wrap:wrap;gap:6px}.tg span{background:rgba(255,255,255,.2);border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:600}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 50%,transparent);outline-offset:1px}button{min-height:48px;cursor:pointer}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) button:not(.g){color:#062b27}:root:not([data-theme=light]) .b{color:#0b1220}}:root[data-theme=dark] button:not(.g){color:#062b27}@media print{#f,button,.n,.hero{display:none}body{background:#fff;color:#000}.c{box-shadow:none}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.9rem}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.r{display:flex;gap:10px}.r>div{flex:1}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px 16px;font:inherit;font-weight:600;width:100%;margin-top:16px}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac);margin-top:8px}
.b{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;color:#fff}
.EMERGENCY{background:var(--red)}.URGENT{background:var(--amb)}.ROUTINE{background:var(--grn)}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;font:.85rem/1.5 ui-monospace,monospace;overflow-x:auto}
.n{font-size:.8rem;color:var(--mu)}.hide{display:none}
</style></head><body><main>
<div class="hero"><h1>🩺 Jithendra Clinic Intake</h1>
<p class="s">Describe symptoms, get a suggested urgency level and a tidy intake sheet for the clinic.</p><div class="tg"><span>⚡ 30-second form</span><span>🚨 Emergency alerts</span><span>📋 Ready-to-use sheet</span></div></div>
<div class="c" id="f">
<label for="nm">Name</label><input id="nm" placeholder="Jane Citizen">
<div class="r"><div><label for="ag">Age</label><input id="ag" type="number" min="0" max="120"></div>
<div><label for="du">Duration</label><select id="du"><option>Less than 24 hours</option><option>1–3 days</option><option>4–7 days</option><option>More than a week</option></select></div></div>
<label for="sy">Symptoms (in your own words)</label>
<textarea id="sy" rows="4" placeholder="e.g. sore throat and mild fever since yesterday"></textarea>
<label for="al">Allergies / current medications</label><input id="al" placeholder="e.g. penicillin allergy; takes paracetamol">
<label for="sv">Severity: <span id="svv">5</span>/10</label><input id="sv" type="range" min="1" max="10" value="5">
<label for="pt">Preferred appointment time</label>
<select id="pt"><option>Earliest available</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select>
<button id="go">Generate intake summary</button></div>
<div id="out" class="hide">
<div class="c"><span class="b" id="lv"></span><p id="msg"></p><p class="n" id="why"></p></div>
<div class="c"><b>Clinic intake sheet</b><pre id="sh"></pre>
<button class="g" id="cp">Copy sheet</button><button class="g" id="pr">Print / Save as PDF</button></div></div>
<p class="n">Prototype for demonstration. Not medical advice. In an emergency call 000 (Australia).</p>
<script>
const RULES=[
{l:'EMERGENCY',k:['chest pain','chest tightness','can\'t breathe','cannot breathe','difficulty breathing','short of breath','stroke','face droop','slurred speech','unconscious','seizure','severe bleeding','suicid','overdose','anaphyla','swollen tongue','blue lips'],t:'Possible red-flag symptom'},
{l:'URGENT',k:['high fever','fever','vomiting','dehydrat','severe pain','blood','broken','fracture','deep cut','infection','rash','pregnan','dizzy','fainting','abdominal pain','burn'],t:'Symptoms that benefit from same-day review'},
];
const CAT={Respiratory:['cough','sore throat','cold','flu','congestion','wheez','breath'],Digestive:['nausea','vomit','diarrh','stomach','abdominal','constipat'],Musculoskeletal:['back','knee','joint','muscle','sprain','fracture','broken'],Skin:['rash','itch','eczema','burn','cut'],Neurological:['headache','migraine','dizzy','numb'],Mental:['anxiety','depress','stress','sleep','panic']};
const $=i=>document.getElementById(i);
$('sv').oninput=()=>$('svv').textContent=$('sv').value;
function triage(txt,age,sev,dur){
 const s=txt.toLowerCase();let lv='ROUTINE',why='No red-flag keywords found; severity and duration are manageable.';
 for(const r of RULES){const h=r.k.find(k=>s.includes(k));if(h&&(r.l==='EMERGENCY'||lv==='ROUTINE')){lv=r.l;why=r.t+' ("'+h+'").';if(r.l==='EMERGENCY')break}}
 if(lv==='ROUTINE'&&sev>=8){lv='URGENT';why='High self-rated severity ('+sev+'/10).'}
 if(lv==='ROUTINE'&&dur==='More than a week'){why='Symptoms lasting over a week should be reviewed, but not urgently.'}
 if(lv!=='EMERGENCY'&&age&&(age<2||age>=75)&&sev>=6){lv='URGENT';why+=' Age group raises priority.'}
 const cats=Object.keys(CAT).filter(c=>CAT[c].some(k=>s.includes(k)));
 return{lv,why,cats:cats.length?cats:['General']};
}
const MSG={EMERGENCY:'Call 000 now or go to the nearest emergency department. Do not wait for an appointment.',URGENT:'Please book a same-day appointment. If symptoms worsen, seek emergency care.',ROUTINE:'A standard appointment is suitable. Seek care sooner if symptoms worsen.'};
$('go').onclick=()=>{
 const nm=$('nm').value.trim()||'Not given',ag=+$('ag').value||'',sy=$('sy').value.trim();
 if(!sy){$('sy').focus();return}
 const sv=+$('sv').value,du=$('du').value,pt=$('pt').value,t=triage(sy,ag,sv,du);
 $('lv').textContent=t.lv;$('lv').className='b '+t.lv;$('msg').textContent=MSG[t.lv];$('why').textContent='Why: '+t.why;
 $('sh').textContent=['PATIENT: '+nm+(ag?' ('+ag+' y)':''),'PRIORITY: '+t.lv,'CATEGORY: '+t.cats.join(', '),'SYMPTOMS: '+sy,'DURATION: '+du,'ALLERGIES/MEDICATIONS: '+($('al').value.trim()||'None stated'),'SEVERITY: '+sv+'/10','PREFERRED TIME: '+pt,'TRIAGE NOTE: '+t.why,'GENERATED: '+new Date().toLocaleString()].join('\n');
 $('out').classList.remove('hide');$('out').scrollIntoView({behavior:'smooth'});
};
$('pr').onclick=()=>window.print();
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('sh').textContent);$('cp').textContent='Copied ✓'}catch(e){$('cp').textContent='Select the text to copy'}};
</script></main></body></html>
